services:
  hello-world-sh:
    image: localhost/code-golf_hello-world-sh:latest
    build:
      context: ./
      dockerfile: hello-world/sh/Containerfile
      args:
        COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./hello-world/sh/:/app
      - ./common.mk:/common.mk
    userns_mode: "keep-id:uid=1000,gid=1000"
