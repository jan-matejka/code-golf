services:
  producer-golang-dev:
    image: localhost/code-golf_message-queue_producer-golang-dev:latest
    build:
      context: ../
      dockerfile: message-queue/golang/Containerfile-dev
    userns_mode: "keep-id"
    network_mode: host
    volumes:
      - "./golang:/home/user/mq:U"
    entrypoint: /bin/zsh

  producer-golang:
    image: localhost/code-golf_message-queue_producer-golang:latest
    build:
      context: ./
      dockerfile: golang/Containerfile
    network_mode: host
    entrypoint: /home/user/mq/main
