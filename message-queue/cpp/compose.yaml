services:
  producer-cpp-dev:
    image: localhost/code-golf_message-queue_producer-cpp-dev:latest
    build:
      context: ../
      dockerfile: message-queue/cpp/Containerfile-dev
    userns_mode: "keep-id"
    network_mode: host
    volumes:
      - "./cpp:/home/user/mq:U"
    entrypoint: /bin/zsh

  producer-cpp:
    image: localhost/code-golf_message-queue_producer-cpp:latest
    build:
      context: ./
      dockerfile: cpp/Containerfile
    network_mode: host
    entrypoint: /home/user/mq/main
