services:
  producer-rust-dev:
    image: localhost/code-golf_message-queue_producer-rust-dev:latest
    build:
      context: ../
      dockerfile: message-queue/rust/Containerfile-dev
    userns_mode: "keep-id"
    network_mode: host
    volumes:
      - "./rust:/home/user/mq:U"
    entrypoint: /bin/zsh

  producer-rust:
    image: localhost/code-golf_message-queue_producer-rust:latest
    build:
      context: ./
      dockerfile: rust/Containerfile
    network_mode: host
    entrypoint: /home/user/mq/main
