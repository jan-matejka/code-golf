services:
  producer-python-dev:
    image: localhost/code-golf_message-queue_producer-python-dev:latest
    build:
      context: ../
      dockerfile: message-queue/python/Containerfile-dev
    userns_mode: "keep-id"
    network_mode: host
    volumes:
      - "./python:/home/user/mq:U"
    entrypoint: /bin/zsh

  producer-python:
    image: localhost/code-golf_message-queue_producer-python:latest
    build:
      context: ./
      dockerfile: python/Containerfile
    network_mode: host
    entrypoint: /bin/zsh -c 'source ~/venv/bin/activate && /home/user/mq/main'
